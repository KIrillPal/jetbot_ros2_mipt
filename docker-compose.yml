services:
  jetbot_educational:
    # image: jetbot_main_docker
    image: jetbot_full_ros2
    # privileged: True
    cap_add:
     - SYS_NICE
    ulimits:
      rtprio: 99
      memlock: -1
    runtime: nvidia
    restart: always
    network_mode: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./src:/home/app/ros2_ws/src
      # Live host devtmpfs. A devices: entry for /dev/ttyLIDAR follows the
      # symlink once at start and keeps that ttyUSB minor forever.
      - /dev:/dev
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=2
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    # Major 188 is ttyUSBx. The lidar moves between those nodes on replug.
    device_cgroup_rules:
      - 'c 188:* rmw'
    devices:
      - /dev/input:/dev/input
      - /dev/ttyMOTOR:/dev/ttyMOTOR
      - /dev/video0:/dev/video0
