ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true
    use_sim_time: false
    publish_tf: false
    print_diagnostics: true
    debug: false
    use_control: false
    odom_frame: odom
    world_frame: odom
    base_link_frame: base_footprint
    transform_timeout: 0.0
    smooth_lagged_data: true
    history_length: 2.0
    predict_to_current_time: false
    reset_on_time_jump: true
    odom0: /lab3/ekf/wheel
    # x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az
    # Wheel encoders: body velocities only; vy=0 is the nonholonomic constraint.
    odom0_config: [false, false, false, false, false, false,
                   true, true, false, false, false, true, false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 100
    odom0_nodelay: true
    odom1: /lab3/ekf/lidar
    # RF2O pose only, with one fixed initial SE(2) alignment and positive covariance.
    odom1_config: [true, true, false, false, false, true,
                   false, false, false, false, false, false, false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 20
    odom1_nodelay: true
    # Provisional low-speed differential-drive model: position changes mainly
    # through measured velocities, not large independent pose random walks.
    # This smooths laser corrections; it does not eliminate RF2O bias.
    process_noise_covariance: [
      0.000100, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000, 0.000000,
