aruco_detector:
  ros__parameters:
    marker_size_m: 0.12
    aruco_dictionary: DICT_5X5_50
    min_side_px: 10.0
    adaptive_thresh_constant: 3.0
    min_otsu_std_dev: 1.0
    max_erroneous_bits_in_border_rate: 0.45
    error_correction_rate: 0.8

aruco_follower:
  ros__parameters:
    stop_distance_m: 0.3
    max_linear_mps: 0.2
    max_angular_radps: 1.5
    search_pause_s: 0.5
    search_min_angle_rad: 0.5
    search_max_angle_rad: 4.5
